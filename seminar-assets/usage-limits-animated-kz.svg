<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Пайдалану: 5 сағаттық және апталық шектер</title><desc id="desc">Параметрлер скриншоты бойынша оқу мысалы. 5 сағаттық шек жаңарғанда апталық қалдық өзгермейді.</desc>
<style>text{font-family:Arial,sans-serif;fill:#252525}.muted{fill:#8a8a8a}.five{animation:five 16s infinite}.week{animation:week 16s infinite}.before{animation:before 16s infinite}.after{animation:after 16s infinite}.focus-five{animation:focusFive 16s infinite}.focus-week{animation:focusWeek 16s infinite}.caption-a{animation:captionA 16s infinite}.caption-b{animation:captionB 16s infinite}.caption-c{animation:after 16s infinite}.cursor{animation:cursor 16s infinite}
@keyframes five{0%{width:0}14%,63%{width:136px}72%,100%{width:170px}}@keyframes week{0%{width:0}14%,100%{width:165px}}@keyframes before{0%,63%{opacity:1}67%,100%{opacity:0}}@keyframes after{0%,66%{opacity:0}72%,100%{opacity:1}}@keyframes focusFive{0%,15%{opacity:0}20%,35%{opacity:1}40%,100%{opacity:0}}@keyframes focusWeek{0%,38%{opacity:0}43%,60%{opacity:1}66%,100%{opacity:0}}@keyframes captionA{0%,37%{opacity:1}40%,100%{opacity:0}}@keyframes captionB{0%,39%{opacity:0}43%,63%{opacity:1}67%,100%{opacity:0}}@keyframes cursor{0%,15%{opacity:0;transform:translate(1015px,242px)}20%,35%{opacity:1;transform:translate(1015px,242px)}45%,60%{opacity:1;transform:translate(1015px,345px)}68%,100%{opacity:0;transform:translate(1015px,345px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.five{width:136px}.week{width:165px}.after,.focus-five,.focus-week,.caption-b,.caption-c,.cursor{opacity:0}.before,.caption-a{opacity:1}}</style>
<rect width="1100" height="570" rx="18" fill="#fcfcfc"/><path d="M260 0V500" stroke="#e1e1e1"/><text x="27" y="48" font-size="25" font-weight="600">Параметрлер</text><rect x="22" y="70" width="216" height="41" rx="21" fill="#f0f0f0"/><circle cx="45" cy="89" r="7" stroke="#8a8a8a" fill="none"/><path d="m50 95 5 5" stroke="#8a8a8a"/><text x="67" y="96" font-size="17" class="muted">Іздеу</text><text x="27" y="150" font-size="17" class="muted">Жеке</text>
<g font-size="18"><text x="30" y="194">⚙ Жалпы</text><text x="30" y="240">☼ Сыртқы түрі</text><text x="30" y="286">♧ Хабарландырулар</text><text x="30" y="332">◎ Профиль</text><text x="30" y="378">▱ Сақтау орны</text><rect x="20" y="406" width="220" height="45" rx="12" fill="#ebebeb"/><text x="30" y="435">◴ Пайдалану</text></g>
<text x="310" y="64" font-size="29" font-weight="600">Пайдалану</text><rect x="310" y="92" width="100" height="41" rx="22" fill="#e6e6e6"/><text x="333" y="119" font-size="18">Шолу</text><text x="434" y="119" font-size="18" class="muted">Аналитика</text><text x="310" y="179" font-size="22" font-weight="600">Жалпы пайдалану лимиттері</text>
<rect x="310" y="203" width="750" height="205" rx="20" fill="#fff" stroke="#dedede"/><path d="M333 305H1038" stroke="#dedede"/>
<rect class="focus-five" x="310" y="203" width="750" height="102" rx="20" fill="#edf4ff" stroke="#739ee8" stroke-width="2"/>
<rect class="focus-week" x="310" y="306" width="750" height="102" rx="20" fill="#edf4ff" stroke="#739ee8" stroke-width="2"/>
<text x="334" y="242" font-size="21" font-weight="600">5 сағаттық пайдалану шегі</text><text class="before muted" x="334" y="274" font-size="17">Қалпына келтіру: 2 сағ 54 мин кейін</text><text class="after" x="334" y="274" font-size="17" fill="#167b65">5 сағаттық шек жаңарды</text>
<rect x="840" y="237" width="170" height="8" rx="4" fill="#e5e5e5"/><rect class="five" x="840" y="237" width="136" height="8" rx="4" fill="#202020"/><text class="before" x="840" y="278" font-size="18">80% қалды</text><text class="after" x="840" y="278" font-size="18">100% қалды</text>
<text x="334" y="344" font-size="21" font-weight="600">Апталық пайдалану шегі</text><text x="334" y="376" font-size="17" class="muted">Қалпына келтіру: 6 күннен кейін</text><rect x="840" y="339" width="170" height="8" rx="4" fill="#e5e5e5"/><rect class="week" x="840" y="339" width="165" height="8" rx="4" fill="#202020"/><text x="840" y="380" font-size="18">97% қалды</text>
<text x="310" y="456" font-size="15" class="muted">Оқу мысалы · қалдық пен жаңару уақытын аккаунттан қараңыз</text>
<path d="M0 500H1100" stroke="#e2e7ef"/><g font-size="22" font-weight="600"><text class="caption-a" x="550" y="543" text-anchor="middle">5 сағат — жеке пайдалану кезеңі</text><text class="caption-b" x="550" y="543" text-anchor="middle">Апталық шек бөлек есептеледі</text><text class="caption-c" x="550" y="543" text-anchor="middle">5 сағаттық шек жаңарды — апталық қалдық сақталды</text></g>
<g class="cursor"><path d="M0 0v28l8-8 7 16 6-3-7-15 12-1Z" fill="#284264" stroke="white" stroke-width="2"/></g>
</svg>
