</style><canvas aria-label="Вращающаяся трёхмерная модель молекулы воды"></canvas><div class="heading"><b>H₂O</b><span id="name">Молекула воды · объёмная модель</span></div><div class="legend"><span><i></i><label id="oxygen">O · кислород</label></span><span><i></i><label id="hydrogen">H · водород</label></span></div><div class="hint" id="hint">Автоматическое вращение</div><div id="fallback">WebGL недоступен</div><script>
(()=>{'use strict';
const kk=new URL(location.href).searchParams.get('lang')==='kz';
if(kk){document.documentElement.lang='kk';document.getElementById('name').textContent='Су молекуласы · көлемді модель';document.getElementById('oxygen').textContent='O · оттек';document.getElementById('hydrogen').textContent='H · сутек';document.getElementById('hint').textContent='Автоматты айналу';}
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:true,alpha:true});

function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 position,normal,color;uniform mat3 rotation;uniform mat4 projection;varying vec3 n,c,p;void main(){p=rotation*position;n=rotation*normal;c=color;gl_Position=projection*vec4(p+vec3(0.,0.,-7.),1.);}`));

gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const data=[];
function vertex(p,n,c){data.push(...p,...n,...c);}
function sphere(center,r,c){const point=(u,v)=>[Math.sin(v)*Math.cos(u),Math.cos(v),Math.sin(v)*Math.sin(u)];const emit=(u,v)=>{const n=point(u,v);vertex(n.map((x,i)=>center[i]+r*x),n,c);};for(let j=0;j<28;j++)for(let i=0;i<44;i++){const u=i/44*Math.PI*2,U=(i+1)/44*Math.PI*2,v=j/28*Math.PI,V=(j+1)/28*Math.PI;emit(u,v);emit(U,v);emit(u,V);emit(U,v);emit(U,V);emit(u,V);}}
const subtract=(a,b)=>a.map((v,i)=>v-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);};
function bond(a,b){const axis=norm(subtract(b,a)),u=norm(cross(axis,[0,0,1])),v=cross(axis,u);function emit(t,angle){const n=u.map((x,i)=>x*Math.cos(angle)+v[i]*Math.sin(angle));vertex(a.map((x,i)=>x+(b[i]-x)*t+n[i]*.14),n,[.56,.7,.81]);}for(let i=0;i<28;i++){const a0=i/28*Math.PI*2,a1=(i+1)/28*Math.PI*2;emit(0,a0);emit(1,a0);emit(0,a1);emit(1,a0);emit(1,a1);emit(0,a1);}}
const angle=104.5/2*Math.PI/180,oxygen=[0,-.2,0],h1=[-Math.sin(angle)*1.65,Math.cos(angle)*1.65-.2,0],h2=[Math.sin(angle)*1.65,Math.cos(angle)*1.65-.2,0];
bond(oxygen,h1);bond(oxygen,h2);sphere(oxygen,.75,[.88,.14,.23]);sphere(h1,.47,[.9,.95,1]);sphere(h2,.47,[.9,.95,1]);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);['position','normal','color'].forEach((name,i)=>{const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,i*12);});
const rot=gl.getUniformLocation(program,'rotation'),proj=gl.getUniformLocation(program,'projection');gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
function draw(time){const width=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)),height=Math.round(canvas.clientHeight*Math.min(devicePixelRatio,2));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}gl.viewport(0,0,width,height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const aspect=width/height,f=1/Math.tan(Math.PI/8),near=.1,far=100;gl.uniformMatrix4fv(proj,false,new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]));const a=time*.00042,b=.22+Math.sin(time*.00025)*.2,cy=Math.cos(a),sy=Math.sin(a),cx=Math.cos(b),sx=Math.sin(b);gl.uniformMatrix3fv(rot,false,new Float32Array([cy,sx*sy,-cx*sy,0,cx,sx,sy,-sx*cy,cx*cy]));gl.drawArrays(gl.TRIANGLES,0,data.length/9);requestAnimationFrame(draw);}
